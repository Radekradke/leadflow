<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LeadFlow Imobiliário — Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
<style>
:root{
  --paper:#F7F6F3; --surface:#fff; --ink:#16191F; --ink9:#0E131B; --ink8:#161C26; --ink7:#1E2632;
  --line:#E7E5E0; --muted:#6C7280; --accent:#0E7C66; --accent6:#0B6552; --accent50:#E6F2EE;
  --r:.75rem; --r2:1rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#app{height:100%}
body{font-family:'Geist',system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#d8d6d0;border-radius:8px}
.mono{font-family:'Geist Mono',monospace}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* layout */
.app{display:flex;height:100%}
.sidebar{width:240px;flex-shrink:0;background:var(--ink9);color:#fff;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:18px 20px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600}
.brand b{font-weight:600;letter-spacing:-.3px}
.nav{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:rgba(255,255,255,.6);font-size:14px;cursor:pointer;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:rgba(255,255,255,.1);color:#fff}
.nav a i{font-size:18px}
.side-foot{border-top:1px solid rgba(255,255,255,.1);padding:12px}
.userbox{display:flex;align-items:center;gap:10px;padding:6px 8px}
.avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.userbox .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbox .rl{font-size:11px;color:rgba(255,255,255,.4)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
.topbar h1{font-size:16px;font-weight:600;letter-spacing:-.2px}
.spacer{flex:1}
.role-switch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.role-switch select{font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);color:var(--ink);cursor:pointer}
.demo-badge{font-size:10px;font-family:'Geist Mono',monospace;color:var(--accent6);background:var(--accent50);padding:3px 8px;border-radius:20px}
.content{flex:1;overflow-y:auto;padding:24px 28px 80px}

/* cards / ui */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 1px 2px rgba(16,19,27,.04),0 1px 3px rgba(16,19,27,.06)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.stat{padding:16px}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:500}
.stat .v{font-family:'Geist Mono',monospace;font-size:26px;font-weight:600;margin-top:4px}
.stat .h{font-size:12px;color:var(--muted);margin-top:2px}
.v.warn{color:#b45309}.v.good{color:var(--accent6)}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin:28px 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--r);padding:9px 14px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;border:1px solid transparent;transition:.15s}
.btn i{font-size:16px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent6)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}.btn-ghost:hover{background:var(--paper)}
.btn-sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input,select.input{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--ink)}
.input:focus{outline:none;border-color:var(--accent)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:500;margin-bottom:5px;display:block}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:500;white-space:nowrap}

/* table */
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line)}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--paper)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .input{width:auto}
.search{position:relative}.search i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
.search input{padding-left:32px}

/* bars */
.barrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.barrow:last-child{border:none}
.bartrack{flex:1;height:8px;background:var(--paper);border-radius:999px;overflow:hidden}
.barfill{height:100%;border-radius:999px;background:var(--accent)}
.barfill.warn{background:#f59e0b}

/* drawer / modal */
.overlay{position:fixed;inset:0;background:rgba(16,19,27,.5);backdrop-filter:blur(3px);z-index:50;display:flex;justify-content:flex-end}
.overlay.center{align-items:center;justify-content:center}
.drawer{width:480px;max-width:100%;height:100%;background:var(--surface);overflow-y:auto;animation:slideIn .2s ease}
.modal{width:420px;max-width:calc(100vw - 32px);background:var(--surface);border-radius:var(--r2);padding:22px;animation:popIn .15s ease}
@keyframes slideIn{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.drawer-body{padding:20px 22px}
.x{cursor:pointer;color:var(--muted);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.x:hover{background:var(--paper);color:var(--ink)}
.field{margin-bottom:13px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv .k{color:var(--muted)}
.timeline{position:relative;padding-left:18px}
.timeline .ev{position:relative;padding:0 0 14px 14px;border-left:2px solid var(--line)}
.timeline .ev:last-child{border-color:transparent}
.timeline .dot{position:absolute;left:-7px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.timeline .ev .t{font-size:13px;font-weight:500}
.timeline .ev .m{font-size:12px;color:var(--muted);margin-top:1px}

.toasts{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink9);color:#fff;padding:11px 15px;border-radius:var(--r);font-size:13px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:popIn .15s ease;max-width:340px}
.toast i{color:#34d399;font-size:18px}

.empty{padding:40px;text-align:center;color:var(--muted);font-size:14px}
.mobile-nav{display:none}

/* login */
.login{display:flex;height:100%}
.login .left{width:50%;background:var(--ink9);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login .left h1{font-size:30px;font-weight:600;line-height:1.2;letter-spacing:-.4px;max-width:420px}
.login .left p{color:rgba(255,255,255,.6);font-size:14px;margin-top:14px;max-width:420px}
.login .right{width:50%;display:flex;align-items:center;justify-content:center;padding:24px}
.login form{width:100%;max-width:340px}

@media(max-width:860px){
  .sidebar{display:none}
  .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
  .content{padding:16px 16px 80px}
  .topbar{padding:12px 16px}
  .drawer{width:100%}
  .login .left{display:none}.login .right{width:100%}
  .hide-sm{display:none}
  .mobile-nav{display:flex;position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30}
  .mobile-nav a{flex:1;text-align:center;padding:10px 0;font-size:11px;color:var(--muted);cursor:pointer}
  .mobile-nav a i{display:block;font-size:20px;margin-bottom:2px}
  .mobile-nav a.active{color:var(--accent)}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts"></div>

<script>
// ════════════════════════════════════════════════════════════
//  DADOS MOCK
// ════════════════════════════════════════════════════════════
const ROLES = {
  ADMIN:{label:'Administrador', sensitive:true, scope:'all'},
  SALES_MANAGER:{label:'Gestor comercial', sensitive:true, scope:'all'},
  COORDINATOR:{label:'Coordenador', sensitive:true, scope:'team'},
  BROKER:{label:'Corretor (Marcos)', sensitive:false, scope:'own'},
};
const STATUS = {
  NEW:{l:'Novo',c:'#475569',bg:'#f1f5f9'},
  AWAITING_DISTRIBUTION:{l:'Aguardando distribuição',c:'#92400e',bg:'#fef3c7'},
  DISTRIBUTED:{l:'Distribuído',c:'#1d4ed8',bg:'#dbeafe'},
  IN_SERVICE:{l:'Em atendimento',c:'#1e40af',bg:'#dbeafe'},
  NO_RESPONSE:{l:'Sem resposta',c:'#92400e',bg:'#fef3c7'},
  IN_QUALIFICATION:{l:'Em qualificação',c:'#4338ca',bg:'#e0e7ff'},
  VISIT_SUGGESTED:{l:'Visita sugerida',c:'#6d28d9',bg:'#ede9fe'},
  VISIT_SCHEDULED:{l:'Visita agendada',c:'#5b21b6',bg:'#ede9fe'},
  FUTURE_PROPOSAL:{l:'Proposta futura',c:'#0f766e',bg:'#ccfbf1'},
  RESOLVED:{l:'Convertido',c:'#0B6552',bg:'#E6F2EE'},
  LOST:{l:'Perdido',c:'#b91c1c',bg:'#fee2e2'},
  TO_REDISTRIBUTE:{l:'Redistribuir',c:'#c2410c',bg:'#ffedd5'},
  ARCHIVED:{l:'Arquivado',c:'#64748b',bg:'#f1f5f9'},
};
// máquina de estados (igual ao backend)
const TRANSITIONS = {
  NEW:['IN_SERVICE','IN_QUALIFICATION','NO_RESPONSE','LOST','ARCHIVED'],
  AWAITING_DISTRIBUTION:['IN_SERVICE','LOST','ARCHIVED'],
  DISTRIBUTED:['IN_SERVICE','NO_RESPONSE','LOST','ARCHIVED'],
  IN_SERVICE:['IN_QUALIFICATION','NO_RESPONSE','VISIT_SUGGESTED','VISIT_SCHEDULED','FUTURE_PROPOSAL','RESOLVED','LOST','TO_REDISTRIBUTE','ARCHIVED'],
  NO_RESPONSE:['IN_SERVICE','IN_QUALIFICATION','LOST','TO_REDISTRIBUTE','ARCHIVED'],
  IN_QUALIFICATION:['IN_SERVICE','VISIT_SUGGESTED','VISIT_SCHEDULED','FUTURE_PROPOSAL','NO_RESPONSE','RESOLVED','LOST','ARCHIVED'],
  VISIT_SUGGESTED:['VISIT_SCHEDULED','IN_QUALIFICATION','NO_RESPONSE','FUTURE_PROPOSAL','RESOLVED','LOST','ARCHIVED'],
  VISIT_SCHEDULED:['FUTURE_PROPOSAL','IN_QUALIFICATION','NO_RESPONSE','RESOLVED','LOST','ARCHIVED'],
  FUTURE_PROPOSAL:['RESOLVED','IN_QUALIFICATION','NO_RESPONSE','LOST','ARCHIVED'],
  RESOLVED:['ARCHIVED'], LOST:['IN_SERVICE','ARCHIVED'], TO_REDISTRIBUTE:['IN_SERVICE','LOST','ARCHIVED'], ARCHIVED:[],
};
const REASON_REQUIRED = ['LOST','ARCHIVED'];

const DAY = 86400000, now = Date.now();
const ago = d => now - d*DAY;

const S = {
  role:'SALES_MANAGER',
  view:'dash',
  brokers:[
    {id:'b1',name:'Marcos Vieira',availability:'AVAILABLE',max:50,accepts:true},
    {id:'b2',name:'Priya Nair',availability:'AVAILABLE',max:40,accepts:true},
    {id:'b3',name:'Lucas Mota',availability:'BUSY',max:50,accepts:true},
    {id:'b4',name:'Sofia Pires',availability:'AVAILABLE',max:30,accepts:true},
    {id:'b5',name:'Juliana Rocha',availability:'AWAY',max:50,accepts:true},
  ],
  queues:[
    {id:'q1',name:'Nova Iguaçu — Leads',strategy:'ROUND_ROBIN',enabled:true,members:['b1','b2','b4'],cursor:null},
    {id:'q2',name:'Lançamento Jacarepaguá',strategy:'LEAST_LOADED',enabled:true,members:['b1','b3','b4'],cursor:null},
    {id:'q3',name:'Retomada / Leads frios',strategy:'RANDOM',enabled:false,members:['b2','b5'],cursor:null},
  ],
  leads:[],
  log:[],
  seq:1,
};

function mkLead(o){ return Object.assign({id:'L'+(1000+S.seq++),createdAt:ago(2),lastContactAt:null,broker:null,interactions:[]},o); }
S.leads = [
  mkLead({name:'Ana Beatriz Souza',phone:'(21) 98812-4471',cpf:'412.889.330-91',income:4800,city:'Nova Iguaçu',origin:'Meta Ads',status:'IN_SERVICE',queueId:'q1',broker:'b1',lastContactAt:ago(1)}),
  mkLead({name:'Carlos Henrique Lima',phone:'(21) 99645-1180',cpf:'225.711.408-32',income:6200,city:'Nova Iguaçu',origin:'Site',status:'VISIT_SCHEDULED',queueId:'q1',broker:'b1',lastContactAt:ago(0)}),
  mkLead({name:'Daniela Martins',phone:'(21) 98123-7755',cpf:'901.334.226-10',income:3500,city:'Belford Roxo',origin:'Indicação',status:'NO_RESPONSE',queueId:'q1',broker:'b2',lastContactAt:ago(5)}),
  mkLead({name:'Eduardo Pacheco',phone:'(21) 99980-2231',cpf:'556.012.789-44',income:9000,city:'Jacarepaguá',origin:'Google Ads',status:'IN_QUALIFICATION',queueId:'q2',broker:'b4',lastContactAt:ago(2)}),
  mkLead({name:'Fernanda Ribeiro',phone:'(21) 98700-9912',cpf:'334.778.120-05',income:5200,city:'Jacarepaguá',origin:'Meta Ads',status:'FUTURE_PROPOSAL',queueId:'q2',broker:'b3',lastContactAt:ago(4)}),
  mkLead({name:'Gabriel Nunes',phone:'(21) 99112-3398',cpf:'778.450.991-23',income:7100,city:'Nova Iguaçu',origin:'Portal Imóveis',status:'RESOLVED',queueId:'q1',broker:'b1',lastContactAt:ago(8)}),
  mkLead({name:'Helena Castro',phone:'(21) 98456-7781',cpf:'120.998.557-66',income:4100,city:'Mesquita',origin:'Meta Ads',status:'LOST',queueId:'q1',broker:'b2',lastContactAt:ago(12)}),
  mkLead({name:'Igor Almeida',phone:'(21) 99323-4410',cpf:'667.221.880-19',income:5800,city:'Jacarepaguá',origin:'Site',status:'DISTRIBUTED',queueId:'q2',broker:'b4',lastContactAt:null}),
  mkLead({name:'Juliana Freitas',phone:'(21) 98890-1123',cpf:'445.667.229-77',income:6700,city:'Nova Iguaçu',origin:'WhatsApp',status:'AWAITING_DISTRIBUTION',queueId:'q1',broker:null,lastContactAt:null}),
  mkLead({name:'Kléber Santos',phone:'(21) 99771-5582',cpf:'310.554.778-40',income:3900,city:'Nilópolis',origin:'Indicação',status:'AWAITING_DISTRIBUTION',queueId:'q1',broker:null,lastContactAt:null}),
  mkLead({name:'Larissa Gomes',phone:'(21) 98221-6634',cpf:'882.119.443-58',income:8800,city:'Jacarepaguá',origin:'Google Ads',status:'AWAITING_DISTRIBUTION',queueId:'q2',broker:null,lastContactAt:null}),
  mkLead({name:'Marcelo Tavares',phone:'(21) 99008-7745',cpf:'559.300.118-92',income:4400,city:'Nova Iguaçu',origin:'Meta Ads',status:'NEW',queueId:null,broker:null,lastContactAt:null}),
];
// seed interactions
S.leads[0].interactions=[{t:'Ligação',m:'Cliente atendeu, interessada em 2 quartos',d:ago(1)},{t:'WhatsApp',m:'Enviado catálogo do empreendimento',d:ago(1)}];
S.leads[1].interactions=[{t:'Visita',m:'Visita agendada para sábado 10h',d:ago(0)}];

// ════════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════════
const $ = (s,r=document)=>r.querySelector(s);
const role = ()=>ROLES[S.role];
const broker = id => S.brokers.find(b=>b.id===id);
const queue = id => S.queues.find(q=>q.id===id);
const activeCount = bid => S.leads.filter(l=>l.broker===bid && !['RESOLVED','LOST','ARCHIVED'].includes(l.status)).length;
function maskCpf(cpf){ if(!cpf) return '—'; return role().sensitive ? cpf : '***.***.**'+cpf.slice(-3,-1)+'-**'.slice(0,0)+cpf.slice(-2); }
function cpfDisplay(cpf){ if(!cpf) return '—'; if(role().sensitive) return cpf; return '***.***.**-'+cpf.slice(-2); }
function pill(status){ const s=STATUS[status]; return `<span class="pill" style="color:${s.c};background:${s.bg}">${s.l}</span>`; }
function fmtDate(d){ if(!d) return '—'; const diff=Math.floor((now-d)/DAY); if(diff===0)return 'hoje'; if(diff===1)return 'ontem'; return diff+' dias atrás'; }

// escopo de leads por papel (anti-IDOR no backend; aqui só pra demonstrar)
function visibleLeads(){
  const sc = role().scope;
  if(sc==='own') return S.leads.filter(l=>l.broker==='b1' && !['RESOLVED','LOST','ARCHIVED'].includes(l.status));
  return S.leads.slice();
}
function toast(msg){
  const el=document.createElement('div');el.className='toast';
  el.innerHTML=`<i class="ti ti-circle-check"></i><span>${msg}</span>`;
  $('#toasts').appendChild(el); setTimeout(()=>el.remove(),3200);
}

// estratégias de distribuição (espelham o motor)
function eligible(q){
  return q.members.map(broker).filter(b=>b.availability==='AVAILABLE'&&b.accepts&&activeCount(b.id)<b.max);
}
function pick(q,cands){
  if(q.strategy==='RANDOM') return cands[Math.floor(Math.random()*cands.length)];
  if(q.strategy==='LEAST_LOADED') return [...cands].sort((a,b)=>activeCount(a.id)-activeCount(b.id)||a.id.localeCompare(b.id))[0];
  // ROUND_ROBIN
  const ord=[...cands].sort((a,b)=>a.id.localeCompare(b.id));
  if(!q.cursor) return ord[0];
  const i=ord.findIndex(c=>c.id===q.cursor); return ord[i===-1?0:(i+1)%ord.length];
}
function distributeLead(lead){
  const q=queue(lead.queueId); if(!q) return {result:'NO_QUEUE'};
  if(lead.broker) return {result:'ALREADY_ASSIGNED'};
  const cands=eligible(q);
  if(!cands.length){ S.log.unshift({d:now,q:q.name,result:'SEM CORRETOR',lead:lead.name}); return {result:'NO_BROKER'}; }
  const chosen=pick(q,cands);
  lead.broker=chosen.id; lead.status='DISTRIBUTED'; q.cursor=chosen.id;
  S.log.unshift({d:now,q:q.name,result:'ATRIBUÍDO → '+chosen.name,lead:lead.name,strategy:q.strategy});
  return {result:'ASSIGNED',broker:chosen};
}

// ════════════════════════════════════════════════════════════
//  RENDER — shell
// ════════════════════════════════════════════════════════════
let LOGGED=false;
const NAV=[
  {k:'dash',label:'Painel',icon:'ti-layout-dashboard'},
  {k:'leads',label:'Leads',icon:'ti-users'},
  {k:'queues',label:'Filas',icon:'ti-stack-2'},
  {k:'dist',label:'Distribuição',icon:'ti-route'},
];
function initials(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();}

function render(){
  if(!LOGGED){ renderLogin(); return; }
  const titleMap={dash:'Painel',leads:'Leads',queues:'Filas',dist:'Distribuição'};
  $('#app').innerHTML=`
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="logo">L</div><b>LeadFlow</b></div>
      <nav class="nav">
        ${NAV.map(n=>`<a class="${S.view===n.k?'active':''}" onclick="go('${n.k}')"><i class="ti ${n.icon}"></i>${n.label}</a>`).join('')}
      </nav>
      <div class="side-foot">
        <div class="userbox"><div class="avatar">${initials(roleName())}</div>
          <div style="min-width:0"><div class="nm">${roleName()}</div><div class="rl">${role().label}</div></div></div>
        <a class="nav" style="display:block;padding:8px 8px;color:rgba(255,255,255,.6);font-size:13px;cursor:pointer" onclick="logout()">Sair</a>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <h1>${titleMap[S.view]}</h1>
        <div class="spacer"></div>
        <span class="demo-badge hide-sm">PROTÓTIPO · dados fictícios</span>
        <div class="role-switch">
          <span class="hide-sm">Simular papel:</span>
          <select onchange="setRole(this.value)">
            ${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${S.role===k?'selected':''}>${v.label}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
    <nav class="mobile-nav">
      ${NAV.map(n=>`<a class="${S.view===n.k?'active':''}" onclick="go('${n.k}')"><i class="ti ${n.icon}"></i>${n.label}</a>`).join('')}
    </nav>
  </div>`;
  renderView();
}
function roleName(){ return S.role==='BROKER'?'Marcos Vieira':'Direção Comercial'; }
function go(v){ S.view=v; render(); }
function setRole(r){ S.role=r; render(); }
function logout(){ LOGGED=false; render(); }

function renderView(){
  const c=$('#content');
  if(S.view==='dash') c.innerHTML=viewDash();
  else if(S.view==='leads') c.innerHTML=viewLeads();
  else if(S.view==='queues') c.innerHTML=viewQueues();
  else if(S.view==='dist') c.innerHTML=viewDist();
}

// ════════════════════════════════════════════════════════════
//  LOGIN
// ════════════════════════════════════════════════════════════

  <div class="login">

    </div>

      <form onsubmit="doLogin(event)">
        <h2 style="font-size:20px;font-weight:600">Entrar</h2>
        <p style="color:var(--muted);font-size:13px;margin-top:4px">Acesse o painel da sua operação.</p>
        <div class="field" style="margin-top:22px"><label class="label">E-mail</label><input class="input" value="admin@demo.local" type="email"></div>
        <div class="field"><label class="label">Senha</label><input class="input" value="••••••••" type="password"></div>

function doLogin(e){ e.preventDefault(); LOGGED=true; S.view='dash'; render(); }

// ════════════════════════════════════════════════════════════
//  DASHBOARD
// ════════════════════════════════════════════════════════════
function viewDash(){
  const isBrokerView = role().scope==='own';
  let html='';
  // operacional
  if(isBrokerView){
    const my=S.leads.filter(l=>l.broker==='b1'&&!['RESOLVED','LOST','ARCHIVED'].includes(l.status));
    const stale=my.filter(l=>((l.lastContactAt||l.createdAt))<ago(3)).length;
    const noresp=my.filter(l=>l.status==='NO_RESPONSE').length;
    const b=broker('b1');
    html+=`<div class="sec-title">Minha operação</div><div class="grid g4">
      ${stat('Carteira ativa',my.length,Math.round(my.length/b.max*100)+'% da capacidade ('+b.max+')')}
      ${stat('Parados',stale,'sem contato há 3+ dias',stale?'warn':'')}
      ${stat('Sem resposta',noresp,'',noresp?'warn':'')}
      ${stat('Tarefas hoje',3,'1 atrasada · 5 pendentes','warn')}
    </div>`;
  } else {
    const awaiting=S.leads.filter(l=>l.status==='AWAITING_DISTRIBUTION').length;
    const stale=S.leads.filter(l=>!['RESOLVED','LOST','ARCHIVED'].includes(l.status)&&((l.lastContactAt||l.createdAt))<ago(3)).length;
    const resolved=S.leads.filter(l=>l.status==='RESOLVED').length, lost=S.leads.filter(l=>l.status==='LOST').length;
    const rate=resolved+lost?Math.round(resolved/(resolved+lost)*100):0;
    html+=`<div class="sec-title">Visão gerencial</div><div class="grid g4">
      ${stat('Aguardando distribuição',awaiting,'',awaiting?'warn':'')}
      ${stat('Leads parados',stale,'',stale?'warn':'')}
      ${stat('Conversão',rate+'%',resolved+' ganhos · '+lost+' perdidos','good')}
      ${stat('Total de leads',S.leads.length,'na base')}
    </div>`;
    // funil
    const counts={}; S.leads.forEach(l=>counts[l.status]=(counts[l.status]||0)+1);
    const fun=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    const maxc=Math.max(...fun.map(f=>f[1]));
    html+=`<div class="sec-title">Leads por status</div><div class="card">${fun.map(([st,n])=>`
      <div class="barrow"><span style="width:160px;font-size:13px">${STATUS[st].l}</span>
      <div class="bartrack"><div class="barfill" style="width:${n/maxc*100}%"></div></div>
      <span class="mono" style="width:30px;text-align:right;font-size:12px;color:var(--muted)">${n}</span></div>`).join('')}</div>`;
    // carga corretores
    html+=`<div class="sec-title">Carga por corretor</div><div class="card">${S.brokers.map(b=>{
      const a=activeCount(b.id),u=Math.round(a/b.max*100);
      return `<div class="barrow"><span style="width:140px;font-size:13px">${b.name}</span>
      <div class="bartrack"><div class="barfill ${u>=90?'warn':''}" style="width:${Math.min(u,100)}%"></div></div>
      <span class="mono" style="width:64px;text-align:right;font-size:12px;color:var(--muted)">${a}/${b.max}</span></div>`;
    }).join('')}</div>`;
  }
  return html;
}
function stat(l,v,h='',tone=''){ return `<div class="card stat"><div class="l">${l}</div><div class="v ${tone}">${v}</div>${h?`<div class="h">${h}</div>`:''}</div>`; }

// ════════════════════════════════════════════════════════════
//  LEADS
// ════════════════════════════════════════════════════════════
let leadFilter={q:'',status:''};
function viewLeads(){
  const rows=visibleLeads().filter(l=>{
    if(leadFilter.status && l.status!==leadFilter.status) return false;
    if(leadFilter.q && !(l.name.toLowerCase().includes(leadFilter.q.toLowerCase())||l.phone.includes(leadFilter.q))) return false;
    return true;
  });
  const statusOpts=Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${leadFilter.status===k?'selected':''}>${v.l}</option>`).join('');
  return `
  <div class="toolbar">
    <div class="search"><i class="ti ti-search"></i><input class="input" placeholder="Buscar nome ou telefone" value="${leadFilter.q}" oninput="leadFilter.q=this.value;renderView()"></div>
    <select class="input" onchange="leadFilter.status=this.value;renderView()"><option value="">Todos os status</option>${statusOpts}</select>
    <div class="spacer"></div>
    <button class="btn btn-primary btn-sm" onclick="openNewLead()"><i class="ti ti-plus"></i>Novo lead</button>
  </div>
  <div class="card" style="overflow:hidden">
    <table><thead><tr><th>Lead</th><th class="hide-sm">CPF</th><th class="hide-sm">Cidade</th><th>Status</th><th class="hide-sm">Corretor</th><th class="hide-sm">Último contato</th></tr></thead>
    <tbody>${rows.length?rows.map(l=>`<tr onclick="openLead('${l.id}')">
      <td><div style="font-weight:500">${l.name}</div><div class="mono" style="font-size:11px;color:var(--muted)">${l.phone}</div></td>
      <td class="hide-sm mono" style="font-size:12px">${cpfDisplay(l.cpf)}</td>
      <td class="hide-sm">${l.city}</td>
      <td>${pill(l.status)}</td>
      <td class="hide-sm">${l.broker?broker(l.broker).name:'<span style="color:var(--muted)">—</span>'}</td>
      <td class="hide-sm" style="color:var(--muted);font-size:12px">${fmtDate(l.lastContactAt)}</td>
    </tr>`).join(''):`<tr><td colspan="6"><div class="empty">Nenhum lead encontrado.</div></td></tr>`}</tbody></table>
  </div>
  ${role().scope==='own'?`<p style="font-size:12px;color:var(--muted);margin-top:10px">Como <b>Corretor</b>, você vê apenas sua carteira ativa e o CPF aparece mascarado. Troque o papel no topo para ver a diferença.</p>`:''}`;
}

// ── drawer detalhe do lead
let openLeadId=null;
function openLead(id){ openLeadId=id; renderDrawer(); }
function closeDrawer(){ openLeadId=null; const o=$('#overlay'); if(o)o.remove(); }
function renderDrawer(){
  const l=S.leads.find(x=>x.id===openLeadId); if(!l) return;
  const trans=TRANSITIONS[l.status]||[];
  let o=$('#overlay'); if(o)o.remove();
  o=document.createElement('div'); o.id='overlay'; o.className='overlay';
  o.onclick=e=>{ if(e.target===o) closeDrawer(); };
  o.innerHTML=`<div class="drawer">
    <div class="drawer-head">
      <div><div style="font-size:18px;font-weight:600">${l.name}</div>
      <div style="margin-top:6px">${pill(l.status)}</div></div>
      <div class="x" onclick="closeDrawer()"><i class="ti ti-x"></i></div>
    </div>
    <div class="drawer-body">
      <div class="kv"><span class="k">Telefone</span><span class="mono">${l.phone}</span></div>
      <div class="kv"><span class="k">CPF</span><span class="mono">${cpfDisplay(l.cpf)} ${!role().sensitive?'<i class="ti ti-lock" style="color:var(--muted)" title="Mascarado para seu papel"></i>':''}</span></div>
      <div class="kv"><span class="k">Renda familiar</span><span class="mono">${role().sensitive?('R$ '+l.income.toLocaleString('pt-BR')):'•••••'}</span></div>
      <div class="kv"><span class="k">Cidade</span><span>${l.city}</span></div>
      <div class="kv"><span class="k">Origem</span><span>${l.origin}</span></div>
      <div class="kv"><span class="k">Fila</span><span>${l.queueId?queue(l.queueId).name:'—'}</span></div>
      <div class="kv"><span class="k">Corretor</span><span>${l.broker?broker(l.broker).name:'—'}</span></div>

      <div style="display:flex;gap:8px;margin:18px 0 6px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="promptInteraction('${l.id}')"><i class="ti ti-message-2"></i>Registrar contato</button>
        ${role().scope!=='own'||true?`<button class="btn btn-ghost btn-sm" onclick="promptTransfer('${l.id}')"><i class="ti ti-arrows-exchange"></i>Transferir</button>`:''}
        ${!l.broker&&l.queueId?`<button class="btn btn-primary btn-sm" onclick="runDistribute('${l.id}')"><i class="ti ti-route"></i>Distribuir</button>`:''}
      </div>

      <div class="label" style="margin-top:16px">Mudar status</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${trans.length?trans.map(t=>`<button class="btn btn-ghost btn-sm" onclick="changeStatus('${l.id}','${t}')">${STATUS[t].l}</button>`).join(''):'<span style="font-size:12px;color:var(--muted)">Status terminal — sem transições.</span>'}
      </div>

      <div class="label" style="margin-top:22px">Histórico de interações</div>
      <div class="timeline">
        ${l.interactions.length?l.interactions.slice().reverse().map(ev=>`<div class="ev"><div class="dot"></div><div class="t">${ev.t}</div><div class="m">${ev.m}</div><div class="m">${fmtDate(ev.d)}</div></div>`).join(''):'<div style="font-size:13px;color:var(--muted)">Sem interações registradas.</div>'}
      </div>
    </div>
  </div>`;
  document.body.appendChild(o);
}
function changeStatus(id,to){
  const l=S.leads.find(x=>x.id===id);
  if(REASON_REQUIRED.includes(to)){
    const reason=prompt('Motivo é obrigatório para "'+STATUS[to].l+'":');
    if(!reason||!reason.trim()) return;
    l.statusReason=reason;
  }
  l.status=to; toast('Status alterado para "'+STATUS[to].l+'"'); renderDrawer(); renderView();
}
function promptInteraction(id){
  const l=S.leads.find(x=>x.id===id);
  const m=prompt('Registrar contato — descreva a interação:');
  if(!m||!m.trim()) return;
  l.interactions.push({t:'Contato',m:m.trim(),d:now}); l.lastContactAt=now;
  toast('Contato registrado'); renderDrawer(); renderView();
}
function promptTransfer(id){
  const l=S.leads.find(x=>x.id===id);
  const opts=S.brokers.filter(b=>b.id!==l.broker).map(b=>b.id+' — '+b.name).join('\n');
  const choice=prompt('Transferir para qual corretor? Digite o ID:\n'+opts+'\n\n(motivo será pedido a seguir)');
  if(!choice) return;
  const b=broker(choice.trim().split(' ')[0]); if(!b){ toast('Corretor inválido'); return; }
  const reason=prompt('Motivo da transferência (obrigatório):');
  if(!reason||!reason.trim()) return;
  l.broker=b.id; if(['NEW','AWAITING_DISTRIBUTION'].includes(l.status)) l.status='DISTRIBUTED';
  l.interactions.push({t:'Transferência',m:'→ '+b.name+' · '+reason.trim(),d:now});
  toast('Lead transferido para '+b.name); renderDrawer(); renderView();
}
function runDistribute(id){
  const l=S.leads.find(x=>x.id===id);
  const r=distributeLead(l);
  if(r.result==='ASSIGNED') toast('Distribuído para '+r.broker.name+' ('+queue(l.queueId).strategy+')');
  else if(r.result==='NO_BROKER') toast('Nenhum corretor elegível na fila');
  else toast('Não foi possível distribuir');
  renderDrawer(); renderView();
}

// ── novo lead
function openNewLead(){
  let o=document.createElement('div'); o.id='overlay'; o.className='overlay center';
  o.onclick=e=>{ if(e.target===o) o.remove(); };
  o.innerHTML=`<div class="modal">
    <div style="font-size:16px;font-weight:600;margin-bottom:16px">Novo lead</div>
    <div class="field"><label class="label">Nome</label><input class="input" id="nl-name" placeholder="Nome do cliente"></div>
    <div class="field"><label class="label">Telefone</label><input class="input" id="nl-phone" placeholder="(21) 9...."></div>
    <div class="field"><label class="label">Cidade</label><input class="input" id="nl-city" placeholder="Cidade de interesse"></div>
    <div class="field"><label class="label">Fila de entrada</label>
      <select class="input" id="nl-queue">
        <option value="">— sem fila (fica como Novo) —</option>
        ${S.queues.map(q=>`<option value="${q.id}">${q.name} ${q.enabled?'(distribui auto)':'(auto desligada)'}</option>`).join('')}
      </select></div>
    <p style="font-size:12px;color:var(--muted);margin-top:4px">Se a fila tiver distribuição automática ligada, o lead já cai num corretor.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
      <button class="btn btn-ghost btn-sm" onclick="this.closest('.overlay').remove()">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="saveNewLead()">Criar lead</button>
    </div>
  </div>`;
  document.body.appendChild(o);
  setTimeout(()=>$('#nl-name').focus(),50);
}
function saveNewLead(){
  const name=$('#nl-name').value.trim(); if(!name){ toast('Informe o nome'); return; }
  const qid=$('#nl-queue').value||null;
  const l=mkLead({name,phone:$('#nl-phone').value||'(21) 90000-0000',cpf:'000.000.000-00',income:5000,city:$('#nl-city').value||'—',origin:'Cadastro manual',status:qid?'AWAITING_DISTRIBUTION':'NEW',queueId:qid,broker:null});
  S.leads.unshift(l);
  $('#overlay').remove();
  // gatilho automático de distribuição
  if(qid && queue(qid).enabled){
    const r=distributeLead(l);
    if(r.result==='ASSIGNED') toast('Lead criado e distribuído para '+r.broker.name);
    else if(r.result==='NO_BROKER') toast('Lead criado — sem corretor elegível, segue na fila');
    else toast('Lead criado');
  } else { toast('Lead criado'); }
  renderView();
}

// ════════════════════════════════════════════════════════════
//  FILAS
// ════════════════════════════════════════════════════════════
const STRAT={ROUND_ROBIN:'Revezamento (round-robin)',LEAST_LOADED:'Menos carga',RANDOM:'Aleatório'};
function viewQueues(){
  return S.queues.map(q=>{
    const awaiting=S.leads.filter(l=>l.queueId===q.id&&l.status==='AWAITING_DISTRIBUTION').length;
    return `<div class="card" style="padding:18px;margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:160px"><div style="font-weight:600;font-size:15px">${q.name}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${q.members.length} corretores · ${awaiting} aguardando</div></div>
        <div class="role-switch"><span class="hide-sm">Estratégia</span>
          <select class="input" style="width:auto" onchange="setStrat('${q.id}',this.value)">
            ${Object.entries(STRAT).map(([k,v])=>`<option value="${k}" ${q.strategy===k?'selected':''}>${v}</option>`).join('')}
          </select></div>
        <button class="btn btn-ghost btn-sm" onclick="toggleQueue('${q.id}')">${q.enabled?'<i class="ti ti-bolt"></i>Auto ligada':'<i class="ti ti-bolt-off"></i>Auto desligada'}</button>
        <button class="btn btn-primary btn-sm" onclick="distributeQueue('${q.id}')" ${awaiting?'':'disabled'}><i class="ti ti-route"></i>Distribuir ${awaiting||''}</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
        ${q.members.map(broker).map(b=>`<span class="pill" style="background:var(--paper);color:var(--ink);border:1px solid var(--line)">
          <span style="width:7px;height:7px;border-radius:50%;background:${b.availability==='AVAILABLE'?'#16b88a':b.availability==='BUSY'?'#f59e0b':'#94a3b8'};margin-right:6px"></span>
          ${b.name} <span class="mono" style="color:var(--muted);margin-left:5px">${activeCount(b.id)}/${b.max}</span></span>`).join('')}
      </div>
    </div>`;
  }).join('');
}
function setStrat(id,v){ queue(id).strategy=v; toast('Estratégia: '+STRAT[v]); }
function toggleQueue(id){ const q=queue(id); q.enabled=!q.enabled; toast(q.name+' — auto '+(q.enabled?'ligada':'desligada')); renderView(); }
function distributeQueue(id){
  const q=queue(id);
  const awaiting=S.leads.filter(l=>l.queueId===id&&l.status==='AWAITING_DISTRIBUTION');
  let n=0; awaiting.forEach(l=>{ if(distributeLead(l).result==='ASSIGNED') n++; });
  toast(n?`${n} lead(s) distribuído(s) por ${STRAT[q.strategy]}`:'Nenhum corretor elegível'); renderView();
}

// ════════════════════════════════════════════════════════════
//  DISTRIBUIÇÃO (logs)
// ════════════════════════════════════════════════════════════
function viewDist(){
  return `<p style="font-size:13px;color:var(--muted);margin-bottom:14px">Registro de cada decisão do motor — quem recebeu, por qual estratégia, ou por que ninguém recebeu.</p>
  <div class="card" style="overflow:hidden">
    <table><thead><tr><th>Quando</th><th>Lead</th><th>Fila</th><th>Resultado</th></tr></thead>
    <tbody>${S.log.length?S.log.map(e=>`<tr style="cursor:default">
      <td style="color:var(--muted);font-size:12px">${e.d===now?'agora':fmtDate(e.d)}</td>
      <td>${e.lead}</td><td>${e.q}</td>
      <td>${e.result.includes('ATRIBUÍDO')?`<span class="pill" style="color:#0B6552;background:#E6F2EE">${e.result}</span>`:`<span class="pill" style="color:#92400e;background:#fef3c7">${e.result}</span>`}</td>
    </tr>`).join(''):`<tr><td colspan="4"><div class="empty">Sem distribuições ainda. Crie um lead numa fila ou use "Distribuir" nas Filas.</div></td></tr>`}</tbody></table>
  </div>`;
}

render();
</script>
</body>
</html>
